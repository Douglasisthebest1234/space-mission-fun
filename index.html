<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Space Mission</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Exo+2:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="space-objects" id="spaceObjects"></div>

  <main class="start-page" id="startPage">
    <h1>Space Mission</h1>
    <p>Welcome, Commander! Your ship is ready for launch.</p>
    <button id="startButton">Start</button>
  </main>

  <section class="mission-menu" id="missionMenu" hidden>
    <h2>Choose Your Mission</h2>
    <div class="menu-options">
      <button class="menu-option" data-mission="creative">Creative</button>
      <button class="menu-option" data-mission="business">Business</button>
      <button class="menu-option" data-mission="science">Science</button>
    </div>
    <button class="back-button" id="backButton">&larr; Back</button>
  </section>

  <section class="confirm-page" id="confirmPage" hidden>
    <h2>Are You Sure?</h2>
    <p class="confirm-mode" id="confirmMode"></p>
    <p class="confirm-description" id="confirmDescription"></p>
    <div class="confirm-buttons">
      <button class="back-button" id="confirmBackButton">&larr; Back</button>
      <button class="confirm-button" id="confirmButton">I'm Sure</button>
    </div>
  </section>

  <section class="build-page" id="buildPage" hidden>
    <header class="build-header">
      <button class="back-button" id="buildBackButton">&larr; Menu</button>
      <h2>Rocket Builder</h2>
      <div class="build-info">
        <span id="buildMode"></span>
        <span id="budgetDisplay"></span>
        <span id="scienceDisplay" class="science-display" hidden></span>
        <span id="buildQuestTracker" class="quest-tracker" hidden></span>
      </div>
      <button class="quest-button" data-open-quests>📜 Quests</button>
    </header>

    <div class="build-layout">
      <aside class="parts-panel" id="partsPanel"></aside>

      <div class="build-area">
        <div class="rocket" id="rocket"></div>
        <p class="build-warning" id="buildWarning" hidden></p>
        <p class="build-hint" id="buildHint">Click a part to add it to your rocket</p>
        <div class="build-actions">
          <button class="clear-button" id="clearButton">Clear Rocket</button>
          <button class="launch-button" id="launchButton">🚀 Launch Rocket</button>
        </div>
        <div class="rocket-stats">
          <div><span>Parts</span><strong id="statParts">0</strong></div>
          <div><span>Mass</span><strong id="statMass">0.0 t</strong></div>
          <div><span>Thrust</span><strong id="statThrust">0 kN</strong></div>
          <div><span>Fuel</span><strong id="statFuel">0</strong></div>
          <div><span>Crew</span><strong id="statCrew">0</strong></div>
          <div id="statCostBox"><span>Cost</span><strong id="statCost">$0</strong></div>
        </div>
      </div>
    </div>
  </section>

  <section class="launch-page" id="launchPage" hidden>
    <header class="build-header">
      <button class="back-button" id="launchBackButton">&larr; Builder</button>
      <h2>Launch Pad</h2>
      <div class="build-info">
        <span id="launchMode"></span>
      </div>
      <button class="quest-button" data-open-quests>📜 Quests</button>
    </header>

    <div class="launch-scene" id="launchScene">
      <canvas class="launch-canvas" id="launchCanvas" aria-hidden="true"></canvas>
      <div class="station" id="station" hidden aria-label="Horizon Station">
        <svg width="440" height="160" viewBox="0 0 440 160" aria-hidden="true">
          <!-- solar panels -->
          <g fill="#1d3f74" stroke="#5b8fd6" stroke-width="1.5">
            <rect x="8" y="18" width="104" height="48" />
            <rect x="8" y="94" width="104" height="48" />
            <rect x="328" y="18" width="104" height="48" />
            <rect x="328" y="94" width="104" height="48" />
          </g>
          <g stroke="#5b8fd6" stroke-width="1" opacity="0.7">
            <path d="M34 18 V66 M60 18 V66 M86 18 V66 M34 94 V142 M60 94 V142 M86 94 V142" />
            <path d="M354 18 V66 M380 18 V66 M406 18 V66 M354 94 V142 M380 94 V142 M406 94 V142" />
            <path d="M8 42 H112 M8 118 H112 M328 42 H432 M328 118 H432" />
          </g>
          <!-- truss -->
          <rect x="60" y="74" width="320" height="12" fill="#8d96a3" />
          <path d="M60 74 L80 86 L100 74 L120 86 L140 74 L160 86 M280 74 L300 86 L320 74 L340 86 L360 74 L380 86" stroke="#5f6773" stroke-width="2" fill="none" />
          <rect x="56" y="62" width="8" height="36" fill="#9aa4b1" />
          <rect x="376" y="62" width="8" height="36" fill="#9aa4b1" />
          <!-- radiators -->
          <rect x="150" y="20" width="26" height="40" fill="#e9edf2" opacity="0.85" />
          <rect x="264" y="100" width="26" height="40" fill="#e9edf2" opacity="0.85" />
          <!-- modules -->
          <rect x="160" y="62" width="120" height="36" rx="16" fill="#eef1f5" />
          <rect x="160" y="78" width="120" height="5" fill="#ff8c32" />
          <rect x="200" y="22" width="40" height="118" rx="14" fill="#f4f6f9" />
          <rect x="226" y="22" width="14" height="118" rx="7" fill="#000" opacity="0.08" />
          <circle cx="220" cy="44" r="5" fill="#4fc3f7" stroke="#6b7380" stroke-width="2" />
          <circle cx="182" cy="80" r="4" fill="#4fc3f7" stroke="#6b7380" stroke-width="1.5" />
          <circle cx="258" cy="80" r="4" fill="#4fc3f7" stroke="#6b7380" stroke-width="1.5" />
          <!-- docking port (bottom) -->
          <rect x="208" y="138" width="24" height="10" fill="#9aa4b1" />
          <rect x="204" y="148" width="32" height="6" fill="#6b7380" />
          <circle class="station-light" cx="220" cy="157" r="3" fill="#7ee787" />
        </svg>
      </div>
      <div class="launch-rocket" id="launchRocket"></div>
      <div class="target-marker" id="targetMarker" hidden></div>
      <p class="launch-empty" id="launchEmpty" hidden>No rocket on the pad</p>
      <div class="explosion" id="explosion" hidden></div>
      <div class="flight-hud" id="flightHud"></div>
      <canvas class="map-canvas" id="mapCanvas" hidden aria-label="Map of the planet and your orbit"></canvas>
      <div class="flight-buttons">
        <button class="speed-button" id="pauseButton" title="Pause (Esc)">⏸ Pause</button>
        <button class="speed-button" id="mapButton" title="Map view (M)">🗺️ Map</button>
        <button class="speed-button" id="speedButton" title="Speed up time">⏩ 1x</button>
      </div>
      <p class="flight-message" id="flightMessage"></p>
    </div>
  </section>

  <div class="quest-overlay" id="questOverlay" hidden>
    <div class="quest-panel" role="dialog" aria-modal="true" aria-labelledby="questTitle">
      <header class="quest-panel-header">
        <h2 id="questTitle">📜 Quests</h2>
        <button class="quest-close" id="questClose" aria-label="Close quests">✕</button>
      </header>
      <div class="quest-list" id="questList"></div>
    </div>
  </div>

  <script src="launch-world.js"></script>
  <script src="script.js"></script>
  <script src="quests.js"></script>
</body>
</html>
